---
- name: Install exporters on every monitored host
  hosts: monitored
  become: true
  roles:
    - role: common
      tags: [common]
    - role: node_exporter
      tags: [node_exporter]

- name: Deploy the observability stack
  hosts: observability
  become: true
  roles:
    - role: common
      tags: [common]
    - role: statsd_exporter
      tags: [statsd_exporter]
    - role: demo_app
      tags: [demo_app]
    - role: vector
      tags: [vector]
    - role: alertmanager
      tags: [alertmanager]
    - role: prometheus
      tags: [prometheus]
    - role: grafana
      tags: [grafana]

  post_tasks:
    - name: Verify every component answers its health check
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200
      loop:
        - http://127.0.0.1:9090/-/ready        # Prometheus
        - http://127.0.0.1:9093/-/ready        # Alertmanager
        - http://127.0.0.1:9100/metrics        # node_exporter
        - http://127.0.0.1:9102/metrics        # statsd_exporter
        - http://127.0.0.1:9598/metrics        # Vector log-derived metrics
        - http://127.0.0.1:8000/healthz        # demo app
        - http://127.0.0.1:3000/api/health     # Grafana
      when: obs_manage_services | bool
      tags: [verify]
