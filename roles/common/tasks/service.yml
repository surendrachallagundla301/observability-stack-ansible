---
# Required vars: common_svc_name, common_svc_exec. Optional: common_svc_env (dict), common_svc_user, common_svc_workdir
- name: "Write systemd unit for {{ common_svc_name }}"
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/service.j2"
    dest: "/etc/systemd/system/{{ common_svc_name }}.service"
    mode: "0644"
  register: common_unit_file
  when: obs_manage_services | bool

- name: "Enable and start {{ common_svc_name }}"
  ansible.builtin.systemd_service:
    name: "{{ common_svc_name }}"
    enabled: true
    state: "{{ 'restarted' if common_unit_file is changed else 'started' }}"
    daemon_reload: "{{ common_unit_file is changed }}"
  when: obs_manage_services | bool
